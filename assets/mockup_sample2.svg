art" fill="#eef2f8">技術デバッグ：CUDAエラーとモデル最適化</text><rect x="86" y="306" width="400" height="50" rx="10" fill="#2b3546" stroke="none" stroke-width="1"/><text x="102" y="329" font-size="12" font-weight="500" text-anchor="start" fill="#e3e9f2">モデル学習中に「CUDA out of memory」エラーが</text><text x="102" y="347" font-size="12" font-weight="500" text-anchor="start" fill="#e3e9f2">発生しています。パラメータは…</text><rect x="86" y="366" width="452" height="151" rx="10" fill="#252e3d" stroke="none" stroke-width="1"/><text x="102" y="399" font-size="14" font-weight="500" text-anchor="start" fill="#f1f4f9">メモリ消費を切って、</text><text x="102" y="423" font-size="14" font-weight="500" text-anchor="start" fill="#f1f4f9">バッチサイズを減少してください。</text><text x="102" y="463" font-size="12" font-weight="500" text-anchor="start" fill="#d7deea">1. バッチサイズを調整する</text><text x="102" y="487" font-size="12" font-weight="500" text-anchor="start" fill="#d7deea">2. 混合精度学習（FP16）を使う</text><rect x="77" y="357" width="470" height="172" rx="12" fill="none" stroke="#F2A313" stroke-width="3.5"/><rect x="62" y="594" width="10" height="10" rx="5" fill="#F2A313"/><text x="81" y="605" font-size="12" font-weight="750" text-anchor="start" fill="#526078">BEFORE</text></g><g><rect x="612" y="82" width="548" height="548" rx="23" fill="#fff" stroke="#dce3ed" stroke-width="1.5"/><path d="M635 82h502a23 23 0 0 1 23 23v35H612V105a23 23 0 0 1 23-23z" fill="#20283a"/><circle cx="640" cy="109" r="6" fill="#ff7167"/><circle cx="660" cy="109" r="6" fill="#ffc24d"/><circle cx="680" cy="109" r="6" fill="#3acb83"/><rect x="756" y="96" width="252" height="25" rx="12" fill="#323b50"/><text x="882" y="113" font-size="12" font-weight="500" text-anchor="middle" fill="#e0e6ef">app.aetherna.example/chat</text><rect x="613" y="140" width="546" height="46" fill="#fff"/><rect x="636" y="150" width="23" height="23" rx="7" fill="#13BFA5" stroke="none" stroke-width="1"/><text x="670" y="168" font-size="17" font-weight="750" text-anchor="start" fill="#243047">AETHERNA AI</