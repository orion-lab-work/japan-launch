<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">AIチャットの日本語ローカライズ Before After</title><desc id="d">同じAIチャット画面で、直訳調と改行崩れを自然な日本語へ整えた比較。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#292b45"/></linearGradient></defs><rect width="1600" height="900" rx="28" fill="url(#bg)"/><text x="800" y="55" text-anchor="middle" fill="#dbe3f1" font-family="Arial,sans-serif" font-size="21" font-weight="700">AI CHAT · 同じ会話を日本語で比較</text><g aria-label="変更箇所の凡例" font-family="Arial, sans-serif" font-size="14" font-weight="700"><rect x="1210" y="22" width="370" height="38" rx="10" fill="#1e293b" fill-opacity=".94"/><rect x="1230" y="34" width="22" height="16" rx="4" fill="none" stroke="#f59e0b" stroke-width="3"/><text x="1260" y="48" fill="#dbe3f1">Before</text><rect x="1340" y="34" width="22" height="16" rx="4" fill="none" stroke="#2dd4bf" stroke-width="3"/><text x="1370" y="48" fill="#dbe3f1">After</text><text x="1425" y="48" fill="#dbe3f1">枠内が変更箇所</text></g>
<g font-family="Arial,'Noto Sans JP',sans-serif"><g transform="translate(40 88)"><rect width="740" height="770" rx="22" fill="#f4f6fa"/><rect x="26" y="20" width="236" height="40" rx="20" fill="#fff0cb"/><text x="144" y="47" text-anchor="middle" fill="#895200" font-size="16" font-weight="700">BEFORE · 直訳調＋改行崩れ</text><rect x="26" y="84" width="688" height="656" rx="16" fill="#171b27"/><rect x="26" y="84" width="688" height="55" rx="16" fill="#202636"/><text x="48" y="120" fill="#eef2ff" font-size="21" font-weight="700">AETHERNA AI　｜　チャット</text><text x="48" y="177" fill="#eef2ff" font-size="20" font-weight="700">技術デバッグ：CUDAエラーとモデル最適化</text><rect x="48" y="198" width="640" height="78" rx="12" fill="#303749"/><text x="65" y="230" fill="#eef2ff" font-size="17">モデル訓練の間にCUDA out of memoryエラーが発</text><text x="65" y="257" fill="#eef2ff" font-size="17">生しています。パラメータは...</text><rect x="48" y="292" width="640" height="316" rx="12" fill="#242d3c"/><text x="65" y="326" fill="#eef2ff" font-size="17">GPUメモリ使用を最適化する必要があります。</text><text x="65" y="353" fill="#eef2ff" font-size="17">以下の方法を考慮してください：</text><text x="75" y="397" fill="#eef2ff" font-size="16">1. バッチサイズを削減（現在64、16か32を試し）</text><text x="75" y="432" fill="#eef2ff" font-size="16">2. 混合精度トレーニング（FP16）を使用</text><text x="75" y="467" fill="#eef2ff" font-size="16">3. 勾配累積を採用する</text><rect x="65" y="492" width="606" height="93" rx="8" fill="#10141e"/><text x="80" y="524" fill="#b8c2d6" font-size="15">scaler.scale(loss).backward()</text><text x="80" y="553" fill="#aab4c6" font-size="14">バッチサイズを32に減らし、FP16有効。</text><text x="65" y="674" fill="#dcfce7" font-size="16">FP16で学習ループが成功裏に開始しました。</text></g>
<g transform="translate(820 88)"><rect width="740" height="770" rx="22" fill="#f4f6fa"/><rect x="26" y="20" width="236" height="40" rx="20" fill="#e85078"/><text x="144" y="47" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">AFTER · 自然な日本語UI</text><rect x="26" y="84" width="688" height="656" rx="16" fill="#171b27"/><rect x="26" y="84" width="688" height="55" rx="16" fill="#202636"/><text x="48" y="120" fill="#eef2ff" font-size="21" font-weight="700">AETHERNA AI　｜　チャット</text><text x="48" y="177" fill="#eef2ff" font-size="20" font-weight="700">技術デバッグ：CUDAエラーとモデル最適化</text><rect x="48" y="198" width="640" height="78" rx="12" fill="#303749"/><text x="65" y="230" fill="#eef2ff" font-size="17">モデル学習中に「CUDA out of memory」エラーが</text><text x="65" y="257" fill="#eef2ff" font-size="17">発生しています。パラメーターは...</text><rect x="48" y="292" width="640" height="316" rx="12" fill="#242d3c"/><text x="65" y="326" fill="#eef2ff" font-size="17">GPUメモリの使用量を抑えて、メモリ不足を</text><text x="65" y="353" fill="#eef2ff" font-size="17">解消しましょう。次の方法を試してください。</text><text x="75" y="397" fill="#eef2ff" font-size="16">1. バッチサイズを小さくする（64なら16または32）</text><text x="75" y="432" fill="#eef2ff" font-size="16">2. 混合精度学習（FP16）を使う</text><text x="75" y="467" fill="#eef2ff" font-size="16">3. 勾配蓄積を使う</text><rect x="65" y="492" width="606" height="93" rx="8" fill="#10141e"/><text x="80" y="524" fill="#b8c2d6" font-size="15">scaler.scale(loss).backward()</text><text x="80" y="553" fill="#aab4c6" font-size="14">バッチサイズを32にし、FP16を有効化。</text><text x="65" y="674" fill="#dcfce7" font-size="16">FP16を有効にして、学習を再開しました。</text></g></g><g aria-label="変更箇所"><rect x="84" y="280" width="648" height="90" rx="12" fill="none" stroke="#f59e0b" stroke-width="3"/><rect x="84" y="374" width="648" height="240" rx="12" fill="none" stroke="#f59e0b" stroke-width="3"/><rect x="864" y="280" width="648" height="90" rx="12" fill="none" stroke="#2dd4bf" stroke-width="3"/><rect x="864" y="374" width="648" height="240" rx="12" fill="none" stroke="#2dd4bf" stroke-width="3"/></g><text x="800" y="885" text-anchor="middle" fill="#dbe3f1" font-family="Arial,'Noto Sans JP',sans-serif" font-size="16">同じ会話と設定 · 改行、専門用語、案内文だけを調整</text></svg>
