<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">習慣トラッカー画面の日本語Before After</title>
<desc id="desc">同じ習慣トラッカー画面で直訳調の挨拶とラベルを自然な日本語へ整えた比較。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dceee9"/><stop offset="1" stop-color="#f4e6d2"/></linearGradient>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#253a35" flood-opacity=".16"/></filter>
</defs>
<rect width="1600" height="900" rx="28" fill="url(#bg)"/>
<text x="800" y="52" text-anchor="middle" fill="#36564f" font-family="Arial,'Noto Sans JP',sans-serif" font-size="22" font-weight="700">HABIT TRACKER APP · 同じ記録を日本語で比較</text><g aria-label="変更箇所の凡例" font-family="Arial, sans-serif" font-size="14" font-weight="700"><rect x="1210" y="22" width="370" height="38" rx="10" fill="#1e293b" fill-opacity=".94"/><rect x="1230" y="34" width="22" height="16" rx="4" fill="none" stroke="#f59e0b" stroke-width="3"/><text x="1260" y="48" fill="#dbe3f1">Before</text><rect x="1340" y="34" width="22" height="16" rx="4" fill="none" stroke="#2dd4bf" stroke-width="3"/><text x="1370" y="48" fill="#dbe3f1">After</text><text x="1425" y="48" fill="#dbe3f1">枠内が変更箇所</text></g>
<g font-family="Arial,'Noto Sans JP',sans-serif">
  <g transform="translate(40 78)">
    <rect width="740" height="780" rx="22" fill="#f7faf7" filter="url(#shadow)"/>
    <rect x="26" y="18" width="236" height="40" rx="20" fill="#fff0cb"/><text x="144" y="45" text-anchor="middle" fill="#895200" font-size="16" font-weight="700">BEFORE · 直訳調の日本語</text>
    <rect x="220" y="76" width="300" height="660" rx="44" fill="#161b22"/>
    <rect x="234" y="90" width="272" height="632" rx="32" fill="#f7f2e7"/>
    <path d="M234 122 Q370 90 506 122 V284 Q370 328 234 284Z" fill="#d2e8df"/>
    <text x="252" y="130" fill="#35463f" font-size="12">今日、10月26日</text><text x="252" y="164" fill="#17211d" font-size="21" font-weight="700">良うござい、Alex</text>
    <circle cx="370" cy="266" r="61" fill="#fff" stroke="#83c8bd" stroke-width="9"/><text x="370" y="266" text-anchor="middle" fill="#263b37" font-size="30" font-weight="700">4:15</text><text x="370" y="289" text-anchor="middle" fill="#263b37" font-size="11">今日の焦点時間</text>
    <text x="252" y="364" fill="#35463f" font-size="13" font-weight="700">ウェルネス要約</text>
    <rect x="248" y="378" width="118" height="70" rx="12" fill="#fff"/><rect x="374" y="378" width="118" height="70" rx="12" fill="#fff"/><text x="258" y="401" fill="#48534f" font-size="10">画面時間</text><text x="258" y="433" fill="#111827" font-size="21" font-weight="700">2.5時間</text><text x="384" y="401" fill="#48534f" font-size="10">焦点時間</text><text x="384" y="433" fill="#111827" font-size="21" font-weight="700">90分</text>
    <rect x="248" y="462" width="244" height="178" rx="14" fill="#fff"/><text x="262" y="489" fill="#35463f" font-size="13" font-weight="700">習慣トラッカー</text><text x="262" y="526" fill="#263b37" font-size="13">あなたの進歩</text><text x="262" y="560" fill="#263b37" font-size="13">20日連続</text><text x="262" y="594" fill="#263b37" font-size="13">日記をつける　5/8</text><text x="262" y="626" fill="#263b37" font-size="13">ストレッチ</text>
    <rect x="234" y="670" width="272" height="52" rx="0" fill="#fff"/><text x="252" y="701" fill="#526761" font-size="11">ホーム　　記録　　統計　　プロフィール</text>
  </g>
  <g transform="translate(820 78)">
    <rect width="740" height="780" rx="22" fill="#f7faf7" filter="url(#shadow)"/>
    <rect x="26" y="18" width="236" height="40" rx="20" fill="#e85078"/><text x="144" y="45" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">AFTER · 自然な日本語UI</text>
    <rect x="220" y="76" width="300" height="660" rx="44" fill="#161b22"/>
    <rect x="234" y="90" width="272" height="632" rx="32" fill="#f7f2e7"/>
    <path d="M234 122 Q370 90 506 122 V284 Q370 328 234 284Z" fill="#d2e8df"/>
    <text x="252" y="130" fill="#35463f" font-size="12">今日、10月26日</text><text x="252" y="164" fill="#17211d" font-size="21" font-weight="700">おはよう、Alex</text>
    <circle cx="370" cy="266" r="61" fill="#fff" stroke="#83c8bd" stroke-width="9"/><text x="370" y="266" text-anchor="middle" fill="#263b37" font-size="30" font-weight="700">4:15</text><text x="370" y="289" text-anchor="middle" fill="#263b37" font-size="11">今日の集中時間</text>
    <text x="252" y="364" fill="#35463f" font-size="13" font-weight="700">今日のまとめ</text>
    <rect x="248" y="378" width="118" height="70" rx="12" fill="#fff"/><rect x="374" y="378" width="118" height="70" rx="12" fill="#fff"/><text x="258" y="401" fill="#48534f" font-size="10">スクリーンタイム</text><text x="258" y="433" fill="#111827" font-size="21" font-weight="700">2.5時間</text><text x="384" y="401" fill="#48534f" font-size="10">集中時間</text><text x="384" y="433" fill="#111827" font-size="21" font-weight="700">90分</text>
    <rect x="248" y="462" width="244" height="178" rx="14" fill="#fff"/><text x="262" y="489" fill="#35463f" font-size="13" font-weight="700">習慣トラッカー</text><text x="262" y="526" fill="#263b37" font-size="13">今日の記録</text><text x="262" y="560" fill="#263b37" font-size="13">20日連続</text><text x="262" y="594" fill="#263b37" font-size="13">日記をつける　5/8</text><text x="262" y="626" fill="#263b37" font-size="13">ストレッチ</text>
    <rect x="234" y="670" width="272" height="52" rx="0" fill="#fff"/><text x="252" y="701" fill="#526761" font-size="11">ホーム　　記録　　統計　　プロフィール</text>
  </g>
</g>
<g aria-label="変更箇所"><rect x="286" y="211" width="242" height="48" rx="9" fill="none" stroke="#f59e0b" stroke-width="3"/><rect x="1066" y="211" width="242" height="48" rx="9" fill="none" stroke="#2dd4bf" stroke-width="3"/><rect x="284" y="449" width="252" height="84" rx="12" fill="none" stroke="#f59e0b" stroke-width="3"/><rect x="1064" y="449" width="252" height="84" rx="12" fill="none" stroke="#2dd4bf" stroke-width="3"/><rect x="284" y="590" width="252" height="58" rx="12" fill="none" stroke="#f59e0b" stroke-width="3"/><rect x="1064" y="590" width="252" height="58" rx="12" fill="none" stroke="#2dd4bf" stroke-width="3"/></g><text x="800" y="885" text-anchor="middle" fill="#36564f" font-family="Arial,'Noto Sans JP',sans-serif" font-size="16">日付・記録・数値は同じ · 挨拶と画面ラベルだけを調整</text>
</svg>
