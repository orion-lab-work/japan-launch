<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">APIキー管理UIの日本語Before After</title><desc id="d">同じAPIキー管理画面で直訳調の専門用語と操作ラベルを自然な日本語へ修正。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111318"/><stop offset="1" stop-color="#202633"/></linearGradient></defs><rect width="1600" height="900" rx="28" fill="url(#bg)"/><text x="800" y="55" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="21" font-weight="700">DEVELOPER DASHBOARD · 同じデータ</text><g aria-label="変更箇所の凡例" font-family="Arial, sans-serif" font-size="14" font-weight="700"><rect x="1210" y="22" width="370" height="38" rx="10" fill="#1e293b" fill-opacity=".94"/><rect x="1230" y="34" width="22" height="16" rx="4" fill="none" stroke="#f59e0b" stroke-width="3"/><text x="1260" y="48" fill="#dbe3f1">Before</text><rect x="1340" y="34" width="22" height="16" rx="4" fill="none" stroke="#2dd4bf" stroke-width="3"/><text x="1370" y="48" fill="#dbe3f1">After</text><text x="1425" y="48" fill="#dbe3f1">枠内が変更箇所</text></g>
<g font-family="Arial,'Noto Sans JP',sans-serif"><g transform="translate(40 88)"><rect width="740" height="770" rx="22" fill="#191d25"/><rect x="26" y="20" width="236" height="40" rx="20" fill="#fff0cb"/><text x="144" y="47" text-anchor="middle" fill="#895200" font-size="16" font-weight="700">BEFORE · 直訳調の日本語</text><rect x="26" y="84" width="688" height="656" rx="14" fill="#11151b" stroke="#313744"/><rect x="26" y="84" width="688" height="52" rx="14" fill="#20252e"/><text x="48" y="120" fill="#edf2fa" font-size="18" font-weight="700">GD　　ダッシュボード　　キー　　セキュリティ　　ログ</text><text x="50" y="180" fill="#f1f5f9" font-size="23" font-weight="700">認証アクセスコントロール</text><text x="50" y="213" fill="#b6c0ce" font-size="17" font-weight="700">APIキー（セキュア認証）管理</text><text x="50" y="242" fill="#9aa5b4" font-size="14">認証のためのAPIキーを管理する開発者ダッシュボード</text><rect x="532" y="193" width="150" height="40" rx="8" fill="#3987e8"/><text x="607" y="219" text-anchor="middle" fill="#fff" font-size="14">+ APIキーを追加</text><rect x="48" y="263" width="644" height="206" rx="10" fill="#1a202a"/><text x="62" y="291" fill="#e8edf5" font-size="13" font-weight="700">キー名　　　 キーID　　　 状態　　 作成日　　 操作</text><path d="M60 303H680M60 344H680M60 385H680M60 426H680" stroke="#303744"/><text x="62" y="330" fill="#e8edf5" font-size="12">GraphicsAPI v2　sk_live_...4a9f　有効　3日前　コピー・再生成・取消</text><text x="62" y="371" fill="#e8edf5" font-size="12">PhotoEditor v1　sk_live_...4a9f　有効　3日前　コピー・再生成・取消</text><text x="62" y="412" fill="#9ba4b2" font-size="12">GraphicsAPI v2　sk_live_...4a9f　期限切れ　3日前</text><text x="62" y="453" fill="#9ba4b2" font-size="12">PhotoAPI v1　　 sk_live_...4a9f　期限切れ　3日前</text><rect x="48" y="487" width="310" height="208" rx="10" fill="#1a202a"/><text x="66" y="520" fill="#e8edf5" font-size="15" font-weight="700">キー使用と制限</text><text x="66" y="552" fill="#bac4d2" font-size="13">要求/分　1,245 / 2,000</text><text x="66" y="587" fill="#bac4d2" font-size="13">POST /auth　1,245　 GET /keys　424</text><text x="66" y="621" fill="#bac4d2" font-size="13">POST /auth　126</text><rect x="378" y="487" width="314" height="208" rx="10" fill="#1a202a"/><text x="396" y="520" fill="#e8edf5" font-size="15" font-weight="700">cURL要求</text><text x="396" y="560" fill="#73caff" font-size="12">curl -H "Authorization: Bearer ..."</text><text x="396" y="588" fill="#73caff" font-size="12">https://api.example.dev/v1/auth</text></g>
<g transform="translate(820 88)"><rect width="740" height="770" rx="22" fill="#191d25"/><rect x="26" y="20" width="236" height="40" rx="20" fill="#e85078"/><text x="144" y="47" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">AFTER · 自然な日本語UI</text><rect x="26" y="84" width="688" height="656" rx="14" fill="#11151b" stroke="#313744"/><rect x="26" y="84" width="688" height="52" rx="14" fill="#20252e"/><text x="48" y="120" fill="#edf2fa" font-size="18" font-weight="700">GD　　ダッシュボード　　キー　　セキュリティ　　ログ</text><text x="50" y="180" fill="#f1f5f9" font-size="23" font-weight="700">APIキー管理</text><text x="50" y="213" fill="#b6c0ce" font-size="17" font-weight="700">開発者向けAPI認証</text><text x="50" y="242" fill="#9aa5b4" font-size="14">APIキーを安全に管理できるダッシュボード</text><rect x="532" y="193" width="150" height="40" rx="8" fill="#3987e8"/><text x="607" y="219" text-anchor="middle" fill="#fff" font-size="14">+ APIキーを追加</text><rect x="48" y="263" width="644" height="206" rx="10" fill="#1a202a"/><text x="62" y="291" fill="#e8edf5" font-size="13" font-weight="700">キー名　　　 キーID　　　 状態　　 作成日　　 操作</text><path d="M60 303H680M60 344H680M60 385H680M60 426H680" stroke="#303744"/><text x="62" y="330" fill="#e8edf5" font-size="12">GraphicsAPI v2　sk_live_...4a9f　有効　3日前　コピー・再発行・無効化</text><text x="62" y="371" fill="#e8edf5" font-size="12">PhotoEditor v1　sk_live_...4a9f　有効　3日前　コピー・再発行・無効化</text><text x="62" y="412" fill="#9ba4b2" font-size="12">GraphicsAPI v2　sk_live_...4a9f　期限切れ　3日前</text><text x="62" y="453" fill="#9ba4b2" font-size="12">PhotoAPI v1　　 sk_live_...4a9f　期限切れ　3日前</text><rect x="48" y="487" width="310" height="208" rx="10" fill="#1a202a"/><text x="66" y="520" fill="#e8edf5" font-size="15" font-weight="700">APIキーの利用状況と上限</text><text x="66" y="552" fill="#bac4d2" font-size="13">リクエスト/分　1,245 / 2,000</text><text x="66" y="587" fill="#bac4d2" font-size="13">POST /auth　1,245　 GET /keys　424</text><text x="66" y="621" fill="#bac4d2" font-size="13">POST /auth　126</text><rect x="378" y="487" width="314" height="208" rx="10" fill="#1a202a"/><text x="396" y="520" fill="#e8edf5" font-size="15" font-weight="700">cURLリクエスト</text><text x="396" y="560" fill="#73caff" font-size="12">curl -H "Authorization: Bearer ..."</text><text x="396" y="588" fill="#73caff" font-size="12">https://api.example.dev/v1/auth</text></g></g><g aria-label="変更箇所"><rect x="82" y="245" width="590" height="54" rx="9" fill="none" stroke="#f59e0b" stroke-width="3"/><rect x="862" y="245" width="590" height="54" rx="9" fill="none" stroke="#2dd4bf" stroke-width="3"/><rect x="94" y="391" width="648" height="84" rx="10" fill="none" stroke="#f59e0b" stroke-width="3"/><rect x="874" y="391" width="648" height="84" rx="10" fill="none" stroke="#2dd4bf" stroke-width="3"/><rect x="88" y="594" width="318" height="48" rx="9" fill="none" stroke="#f59e0b" stroke-width="3"/><rect x="868" y="594" width="318" height="48" rx="9" fill="none" stroke="#2dd4bf" stroke-width="3"/></g><text x="800" y="885" text-anchor="middle" fill="#cbd5e1" font-family="Arial,'Noto Sans JP',sans-serif" font-size="16">キーと利用状況は同じ · 技術用語と操作ラベルだけを調整</text></svg>
