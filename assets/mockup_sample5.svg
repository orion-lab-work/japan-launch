<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="indigoGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="cardShadow5" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad5)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>

  <!-- Top Category Pill & English Main Title -->
  <rect x="60" y="32" width="370" height="28" rx="14" fill="rgba(99, 102, 241, 0.15)" stroke="#6366F1" stroke-width="1"/>
  <text x="75" y="51" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#A5B4FC" letter-spacing="1">SAMPLE #05: DEVELOPER TOOLS &amp; WEB PLATFORMS</text>
  
  <text x="60" y="94" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">How Catastrophic Context Mistakes ("Photo Editor" as a Person) Destroy Trust</text>
  <text x="60" y="120" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#94A3B8">Original English: "Modern auth for developers with no unexpected bills. Free online photo editor for professionals."</text>

  <!-- LEFT CARD: BEFORE -->
  <g transform="translate(60, 140)" filter="url(#cardShadow5)">
    <!-- Card Container -->
    <rect width="520" height="490" rx="18" fill="#131B2E" stroke="#EF4444" stroke-width="1.5"/>
    
    <!-- Window Bar -->
    <rect width="520" height="42" rx="18" fill="#0D1322"/>
    <rect y="24" width="520" height="18" fill="#0D1322"/>
    <circle cx="24" cy="21" r="5" fill="#FF5F56"/>
    <circle cx="42" cy="21" r="5" fill="#FFBD2E"/>
    <circle cx="60" cy="21" r="5" fill="#27C93F"/>
    
    <!-- Status Badge -->
    <rect x="235" y="8" width="270" height="26" rx="13" fill="rgba(239, 68, 68, 0.2)" stroke="#EF4444" stroke-width="1"/>
    <text x="370" y="25" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#F87171" text-anchor="middle">❌ BEFORE: FATAL MISTRANSLATION</text>

    <!-- App Screen Inside -->
    <g transform="translate(30, 60)">
      <rect width="460" height="290" rx="14" fill="#0B0F19"/>
      
      <!-- Top App Bar -->
      <rect width="460" height="36" rx="14" fill="#161F30"/>
      <rect y="20" width="460" height="16" fill="#161F30"/>
      <text x="20" y="23" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#94A3B8">Dev Console &amp; Creative Tools</text>
      
      <!-- Content with Red Highlight -->
      <g transform="translate(25, 40)">
        <text x="0" y="18" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#94A3B8">Literal AI translation errors:</text>
        
        <rect x="0" y="28" width="410" height="110" rx="6" fill="rgba(239, 68, 68, 0.1)" stroke="#EF4444" stroke-dasharray="4 2"/>
        <text x="16" y="52" font-family="'Noto Sans JP', sans-serif" font-size="14.5" font-weight="800" fill="#F87171">開発者のためのモ / ダンな認証基盤。</text>
        <text x="16" y="76" font-family="'Noto Sans JP', sans-serif" font-size="13" fill="#CBD5E1">予期せぬ請求なし。</text>
        <text x="16" y="102" font-family="'Noto Sans JP', sans-serif" font-size="15" font-weight="800" fill="#DC2626">無料の写真編集者（※人間の職業名）</text>
        
        <rect x="0" y="155" width="200" height="38" rx="6" fill="#334155"/>
        <text x="100" y="179" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Start Free Trial</text>
      </g>
    </g>

    <!-- English Explanation Note -->
    <g transform="translate(30, 375)">
      <rect width="460" height="95" rx="10" fill="rgba(239, 68, 68, 0.12)" stroke="rgba(239, 68, 68, 0.35)" stroke-width="1"/>
      <text x="18" y="24" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#FFA3A3">WHY THIS FAILS IN JAPANESE:</text>
      <text x="18" y="46" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">AI translated "photo editor" (tool) as "写真編集者" (a human job title!).</text>
      <text x="18" y="66" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">Plus "モダン" broke mid-word into "モ / ダン". Japanese engineers</text>
      <text x="18" y="84" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#E2E8F0">immediately conclude the codebase and security are unreliable.</text>
    </g>
  </g>

  <!-- RIGHT CARD: AFTER -->
  <g transform="translate(620, 140)" filter="url(#cardShadow5)">
    <!-- Card Container -->
    <rect width="520" height="490" rx="18" fill="#131B2E" stroke="#10B981" stroke-width="2"/>
    
    <!-- Window Bar -->
    <rect width="520" height="42" rx="18" fill="#0D1322"/>
    <rect y="24" width="520" height="18" fill="#0D1322"/>
    <circle cx="24" cy="21" r="5" fill="#FF5F56"/>
    <circle cx="42" cy="21" r="5" fill="#FFBD2E"/>
    <circle cx="60" cy="21" r="5" fill="#27C93F"/>
    
    <!-- Status Badge -->
    <rect x="235" y="8" width="270" height="26" rx="13" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981" stroke-width="1"/>
    <text x="370" y="25" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#34D399" text-anchor="middle">✔ AFTER: JAPAN LAUNCH NATIVE COPY</text>

    <!-- App Screen Inside -->
    <g transform="translate(30, 60)">
      <rect width="460" height="290" rx="14" fill="#0B0F19"/>
      
      <!-- Top App Bar -->
      <rect width="460" height="36" rx="14" fill="#161F30"/>
      <rect y="20" width="460" height="16" fill="#161F30"/>
      <text x="20" y="23" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#94A3B8">Dev Console &amp; Creative Tools</text>
      
      <!-- Content with Green Highlight -->
      <g transform="translate(25, 40)">
        <text x="0" y="18" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#059669">Production-Grade Technical Japanese:</text>
        
        <rect x="0" y="28" width="410" height="110" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
        <text x="16" y="52" font-family="'Noto Sans JP', sans-serif" font-size="14.5" font-weight="800" fill="#047857">次世代SaaSのためのセキュアな認証基盤。</text>
        <text x="16" y="74" font-family="'Noto Sans JP', sans-serif" font-size="13" font-weight="600" fill="#065F46">予期せぬ追加費用のない、明快な従量課金体系。</text>
        <text x="16" y="98" font-family="'Noto Sans JP', sans-serif" font-size="13" font-weight="700" fill="#047857">ブラウザで完結するプロ向け画像編集ツール。</text>
        <text x="16" y="122" font-family="'Segoe UI', sans-serif" font-size="11" fill="#10B981">Zero ambiguity. Exact industry-standard terminology.</text>
        
        <rect x="0" y="155" width="220" height="38" rx="6" fill="url(#indigoGrad5)"/>
        <text x="110" y="179" font-family="'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">今すぐドキュメントを見る（無料）</text>
      </g>
    </g>

    <!-- English Explanation Note -->
    <g transform="translate(30, 375)">
      <rect width="460" height="95" rx="10" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1"/>
      <text x="18" y="24" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#34D399">WHAT WE FIXED &amp; WHY IT CONVERTS:</text>
      <text x="18" y="46" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">Corrected tool noun to "プロ向け画像編集ツール" (editing software).</text>
      <text x="18" y="66" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">Used standard Japanese tech terms ("セキュアな認証基盤").</text>
      <text x="18" y="84" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#E2E8F0">Assures developers that the tool is ready for mission-critical use.</text>
    </g>
  </g>
</svg>
