<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">製品ドキュメントの日本語 Before After</title><desc id="d">同じ製品要件ドキュメントで、直訳調の表現と用語を自然な日本語へ整えた比較。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#edf2f9"/><stop offset="1" stop-color="#d9e2ef"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".15"/></filter></defs><rect width="1600" height="900" rx="28" fill="url(#bg)"/><text x="800" y="55" text-anchor="middle" fill="#334155" font-family="Arial,sans-serif" font-size="21" font-weight="700">PRODUCT WIKI · 同じ文書を日本語で比較</text><g aria-label="変更箇所の凡例" font-family="Arial, sans-serif" font-size="14" font-weight="700"><rect x="1210" y="22" width="370" height="38" rx="10" fill="#1e293b" fill-opacity=".94"/><rect x="1230" y="34" width="22" height="16" rx="4" fill="none" stroke="#f59e0b" stroke-width="3"/><text x="1260" y="48" fill="#dbe3f1">Before</text><rect x="1340" y="34" width="22" height="16" rx="4" fill="none" stroke="#2dd4bf" stroke-width="3"/><text x="1370" y="48" fill="#dbe3f1">After</text><text x="1425" y="48" fill="#dbe3f1">枠内が変更箇所</text></g>
<g font-family="Arial,'Noto Sans JP',sans-serif"><g transform="translate(40 88)"><rect width="740" height="770" rx="22" fill="#fff" filter="url(#shadow)"/><rect x="26" y="20" width="236" height="40" rx="20" fill="#fff0cb"/><text x="144" y="47" text-anchor="middle" fill="#895200" font-size="16" font-weight="700">BEFORE · 直訳調の日本語</text><rect x="26" y="84" width="688" height="656" rx="12" fill="#fff" stroke="#d8dee8"/><rect x="26" y="84" width="688" height="52" rx="12" fill="#f4f6f9"/><text x="48" y="120" fill="#334155" font-size="18" font-weight="700">Vertex Wiki　›　製品ドキュメント</text><text x="48" y="181" fill="#111827" font-size="22" font-weight="700">製品要求ドキュメント：Q4ロードマップ v2.1</text><rect x="48" y="201" width="644" height="105" rx="12" fill="#eaf3ff"/><text x="66" y="231" fill="#1e3a5f" font-size="16" font-weight="700">AI要約</text><text x="66" y="261" fill="#334155" font-size="16">この文書はQ4ロードマップと製品要求を</text><text x="66" y="287" fill="#334155" font-size="16">まとめることをしています。</text><text x="48" y="343" fill="#111827" font-size="18" font-weight="700">1. はじめに</text><text x="48" y="372" fill="#334155" font-size="15">Q4ロードマップと要件の内容を説明します。</text><text x="48" y="419" fill="#111827" font-size="18" font-weight="700">2. 重要な特徴</text><text x="60" y="448" fill="#334155" font-size="15">・構成要素：製品の機能と設計の部品。</text><text x="60" y="477" fill="#334155" font-size="15">・主要機能：リッチメディアのMarkdown対応。</text><text x="60" y="506" fill="#334155" font-size="15">・アップデート：リリース日の計画。</text><text x="48" y="554" fill="#111827" font-size="18" font-weight="700">3. マイルストーン</text><text x="60" y="583" fill="#334155" font-size="15">・マイルストーン1：最初の節目。</text><text x="60" y="612" fill="#334155" font-size="15">・マイルストーン2：実装の節目。</text><text x="60" y="641" fill="#334155" font-size="15">・マイルストーン3：最終の節目。</text><text x="48" y="692" fill="#111827" font-size="18" font-weight="700">4. 測定基準</text><text x="60" y="721" fill="#334155" font-size="15">平均値と完了状況を記録します。</text></g>
<g transform="translate(820 88)"><rect width="740" height="770" rx="22" fill="#fff" filter="url(#shadow)"/><rect x="26" y="20" width="236" height="40" rx="20" fill="#e85078"/><text x="144" y="47" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">AFTER · 自然な日本語UI</text><rect x="26" y="84" width="688" height="656" rx="12" fill="#fff" stroke="#d8dee8"/><rect x="26" y="84" width="688" height="52" rx="12" fill="#f4f6f9"/><text x="48" y="120" fill="#334155" font-size="18" font-weight="700">Vertex Wiki　›　製品ドキュメント</text><text x="48" y="181" fill="#111827" font-size="22" font-weight="700">製品要件書：Q4ロードマップ v2.1</text><rect x="48" y="201" width="644" height="105" rx="12" fill="#eaf3ff"/><text x="66" y="231" fill="#1e3a5f" font-size="16" font-weight="700">AIによる要約</text><text x="66" y="261" fill="#334155" font-size="16">この文書では、Q4ロードマップと製品要件を</text><text x="66" y="287" fill="#334155" font-size="16">まとめています。</text><text x="48" y="343" fill="#111827" font-size="18" font-weight="700">1. はじめに</text><text x="48" y="372" fill="#334155" font-size="15">Q4ロードマップと製品要件の概要です。</text><text x="48" y="419" fill="#111827" font-size="18" font-weight="700">2. 主な機能</text><text x="60" y="448" fill="#334155" font-size="15">・構成要素：製品の機能と設計方針。</text><text x="60" y="477" fill="#334155" font-size="15">・主な機能：リッチメディア対応のMarkdown。</text><text x="60" y="506" fill="#334155" font-size="15">・更新内容：リリース予定を記載。</text><text x="48" y="554" fill="#111827" font-size="18" font-weight="700">3. マイルストーン</text><text x="60" y="583" fill="#334155" font-size="15">・マイルストーン1：最初の節目。</text><text x="60" y="612" fill="#334155" font-size="15">・マイルストーン2：実装の節目。</text><text x="60" y="641" fill="#334155" font-size="15">・マイルストーン3：最終の節目。</text><text x="48" y="692" fill="#111827" font-size="18" font-weight="700">4. 測定基準</text><text x="60" y="721" fill="#334155" font-size="15">平均値と完了状況を記録します。</text></g></g><g aria-label="変更箇所"><rect x="82" y="252" width="652" height="64" rx="9" fill="none" stroke="#f59e0b" stroke-width="3"/><rect x="82" y="282" width="652" height="118" rx="12" fill="none" stroke="#f59e0b" stroke-width="3"/><rect x="862" y="252" width="652" height="64" rx="9" fill="none" stroke="#2dd4bf" stroke-width="3"/><rect x="862" y="282" width="652" height="118" rx="12" fill="none" stroke="#2dd4bf" stroke-width="3"/></g><text x="800" y="885" text-anchor="middle" fill="#334155" font-family="Arial,'Noto Sans JP',sans-serif" font-size="16">要件と内容は同じ · 用語と要約の日本語だけを調整</text></svg>
