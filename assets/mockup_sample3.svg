<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="purpleGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="cardShadow3" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad3)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>

  <!-- Top Category Pill & English Main Title -->
  <rect x="60" y="32" width="370" height="28" rx="14" fill="rgba(168, 85, 247, 0.15)" stroke="#A855F7" stroke-width="1"/>
  <text x="75" y="51" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#C084FC" letter-spacing="1">SAMPLE #03: B2B SAAS &amp; ENTERPRISE TOOLS</text>
  
  <text x="60" y="94" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">How Hype Words ("Finally!") Alienate Japanese Enterprise Buyers</text>
  <text x="60" y="120" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#94A3B8">Original English: "Verified knowledge, in sync with reality. Finally, an AI knowledge base that does the work."</text>

  <!-- LEFT CARD: BEFORE -->
  <g transform="translate(60, 140)" filter="url(#cardShadow3)">
    <!-- Card Container -->
    <rect width="520" height="490" rx="18" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
    
    <!-- Window Bar -->
    <rect width="520" height="42" rx="18" fill="#0F172A"/>
    <rect y="24" width="520" height="18" fill="#0F172A"/>
    <circle cx="24" cy="21" r="5" fill="#FF5F56"/>
    <circle cx="42" cy="21" r="5" fill="#FFBD2E"/>
    <circle cx="60" cy="21" r="5" fill="#27C93F"/>
    
    <!-- Status Badge -->
    <rect x="235" y="8" width="270" height="26" rx="13" fill="rgba(239, 68, 68, 0.2)" stroke="#EF4444" stroke-width="1"/>
    <text x="370" y="25" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#F87171" text-anchor="middle">❌ BEFORE: OVERLY DRAMATIC HYPE</text>

    <!-- App Screen Inside -->
    <g transform="translate(30, 60)">
      <rect width="460" height="290" rx="14" fill="#FFFFFF"/>
      
      <!-- Top Bar -->
      <rect width="460" height="36" rx="14" fill="#F8FAFC"/>
      <rect y="20" width="460" height="16" fill="#F8FAFC"/>
      <text x="20" y="23" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#64748B">Enterprise AI Knowledge Wiki</text>
      
      <!-- Content with Red Highlight -->
      <g transform="translate(25, 50)">
        <text x="0" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#94A3B8">Literal translation from English:</text>
        
        <rect x="0" y="32" width="410" height="85" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-dasharray="4 2"/>
        <text x="16" y="58" font-family="'Noto Sans JP', sans-serif" font-size="15.5" font-weight="800" fill="#DC2626">検証済みナレッジ、現実と同期。</text>
        <text x="16" y="86" font-family="'Noto Sans JP', sans-serif" font-size="15" font-weight="700" fill="#EF4444">ついに、仕事をするAIナレッジベースが登場</text>
        <text x="315" y="86" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#DC2626">("Finally!")</text>
        
        <rect x="0" y="145" width="200" height="40" rx="8" fill="#475569"/>
        <text x="100" y="170" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Book a Demo</text>
      </g>
    </g>

    <!-- English Explanation Note -->
    <g transform="translate(30, 375)">
      <rect width="460" height="95" rx="10" fill="rgba(239, 68, 68, 0.12)" stroke="rgba(239, 68, 68, 0.35)" stroke-width="1"/>
      <text x="18" y="24" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#FFA3A3">WHY THIS FAILS IN JAPANESE:</text>
      <text x="18" y="46" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">In Japanese B2B SaaS, "ついに" (Finally!) sounds melodramatic,</text>
      <text x="18" y="66" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">like late-night TV infomercials. Furthermore, "in sync with reality"</text>
      <text x="18" y="84" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#E2E8F0">is too vague for Japanese engineers and project leads.</text>
    </g>
  </g>

  <!-- RIGHT CARD: AFTER -->
  <g transform="translate(620, 140)" filter="url(#cardShadow3)">
    <!-- Card Container -->
    <rect width="520" height="490" rx="18" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    
    <!-- Window Bar -->
    <rect width="520" height="42" rx="18" fill="#0F172A"/>
    <rect y="24" width="520" height="18" fill="#0F172A"/>
    <circle cx="24" cy="21" r="5" fill="#FF5F56"/>
    <circle cx="42" cy="21" r="5" fill="#FFBD2E"/>
    <circle cx="60" cy="21" r="5" fill="#27C93F"/>
    
    <!-- Status Badge -->
    <rect x="235" y="8" width="270" height="26" rx="13" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981" stroke-width="1"/>
    <text x="370" y="25" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#34D399" text-anchor="middle">✔ AFTER: JAPAN LAUNCH NATIVE COPY</text>

    <!-- App Screen Inside -->
    <g transform="translate(30, 60)">
      <rect width="460" height="290" rx="14" fill="#FFFFFF"/>
      
      <!-- Top Bar -->
      <rect width="460" height="36" rx="14" fill="#F8FAFC"/>
      <rect y="20" width="460" height="16" fill="#F8FAFC"/>
      <text x="20" y="23" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#475569">Enterprise AI Knowledge Wiki</text>
      
      <!-- Content with Green Highlight -->
      <g transform="translate(25, 50)">
        <text x="0" y="20" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#059669">B2B Verified Japanese Copy:</text>
        
        <rect x="0" y="32" width="410" height="85" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
        <text x="16" y="58" font-family="'Noto Sans JP', sans-serif" font-size="15.5" font-weight="800" fill="#047857">検証済みナレッジを、リアルタイムで同期。</text>
        <text x="16" y="86" font-family="'Noto Sans JP', sans-serif" font-size="15" font-weight="700" fill="#065F46">自ら仕事を進めるAIナレッジベース、登場。</text>
        
        <rect x="0" y="145" width="220" height="40" rx="8" fill="url(#purpleGrad3)"/>
        <text x="110" y="170" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">無料デモを予約する（日本語）</text>
      </g>
    </g>

    <!-- English Explanation Note -->
    <g transform="translate(30, 375)">
      <rect width="460" height="95" rx="10" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1"/>
      <text x="18" y="24" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#34D399">WHAT WE FIXED &amp; WHY IT CONVERTS:</text>
      <text x="18" y="46" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">Replaced "reality sync" with "リアルタイムで同期" (real-time sync).</text>
      <text x="18" y="66" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">Replaced infomercial "ついに" with authoritative crisp "登場".</text>
      <text x="18" y="84" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#E2E8F0">Instantly earns credibility with Japanese tech decision-makers.</text>
    </g>
  </g>
</svg>
